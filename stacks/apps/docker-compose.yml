# =============================================================
# APPS STACK — managed by SysteM repo
# IMAGE TAGS ON EACH SERVICE ARE UPDATED AUTOMATICALLY BY CI
# DO NOT EDIT IMAGE TAGS MANUALLY
# Managed by: Portainer GitOps — stacks/apps/docker-compose.yml
# =============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-go-service: &go-service
  cap_drop:
    - ALL
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp
  env_file:
    - path: .env
      required: false

services:
  backend-api:
    <<: *go-service
    # {"$imagepolicy": "trading-terminal:backend-api:tag"}
    image: ghcr.io/trading-terminal2025/terminal-backend-api:sha-cedf5b525e01ef96485631e199eca205dab659ed
    ports:
      - "8081:8081"
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      POSTGRES_DSN: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-terminal_backend}?sslmode=disable
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-REDACTED_TOKEN}
      INFLUXDB_ORG: terminal
      INFLUXDB_BUCKET_M1: candles_m1
      INFLUXDB_BUCKET_M5: candles_m5
      INFLUXDB_BUCKET_LONG: candles_long
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-change-me@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-1234}
    # Cross-stack depends_on is not supported by Docker Compose.
    # Infra readiness is enforced by deploying trading-infra before trading-apps.
    # backend-api handles dependency retries at runtime.
    logging: *default-logging
    mem_limit: 2048m
    mem_reservation: 1024m
    read_only: true

  oms:
    <<: *go-service
    # {"$imagepolicy": "trading-terminal:oms:tag"}
    image: ghcr.io/trading-terminal2025/terminal-backend-oms:sha-cedf5b525e01ef96485631e199eca205dab659ed
    depends_on:
      backend-api:
        condition: service_started
    logging: *default-logging
    mem_limit: 1536m
    mem_reservation: 768m
    read_only: true

  mt5-bridge:
    <<: *go-service
    # {"$imagepolicy": "trading-terminal:mt5-bridge:tag"}
    image: ghcr.io/trading-terminal2025/terminal-mt5-bridge:sha-cedf5b525e01ef96485631e199eca205dab659ed
    ports:
      - "5556:5556"
    logging: *default-logging
    mem_limit: 1024m
    mem_reservation: 512m
    read_only: true

  market-data-bridge:
    <<: *go-service
    # {"$imagepolicy": "trading-terminal:market-data-bridge:tag"}
    image: ghcr.io/trading-terminal2025/terminal-market-data-bridge:sha-cedf5b525e01ef96485631e199eca205dab659ed
    ports:
      - "5558:5558"
    logging: *default-logging
    mem_limit: 1024m
    mem_reservation: 512m
    read_only: true

  ui-terminal:
    # {"$imagepolicy": "trading-terminal:ui-terminal:tag"}
    image: ghcr.io/trading-terminal2025/ui-terminal:sha-002ac69847481de9b3b816e9460ed07b6c7ec8b4
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1024m
    mem_reservation: 512m

  dashboard:
    # {"$imagepolicy": "trading-terminal:terminal-dashboard:tag"}
    image: ghcr.io/trading-terminal2025/terminal-dashboard:sha-3d19df2e97bc49edb6696a5eec72bd36e868846a
    ports:
      - "127.0.0.1:3002:80"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    mem_reservation: 256m

networks:
  default:
    name: trading-infra
    external: true
