replicaCount: 1

image:
  repository: clickhouse/clickhouse-server
  tag: "24.3"
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  size: 50Gi

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

service:
  type: ClusterIP
  ports:
    http: 8123
    native: 9000

config:
  users:
    default:
      password: ""
      networks:
        - "::/0"
      profile: default
      quota: default

  profiles:
    default:
      max_memory_usage: 1000000000
      use_uncompressed_cache: 0
      load_balancing: random

extraEnvVars:
  - name: CLICKHOUSE_DB
    value: app
  - name: CLICKHOUSE_USER
    value: default
  - name: CLICKHOUSE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: clickhouse-credentials
        key: password

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
