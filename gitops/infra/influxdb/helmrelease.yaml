apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: influxdb
  namespace: infra
spec:
  interval: 1h
  chart:
    spec:
      chart: influxdb2
      version: "2.x"
      sourceRef:
        kind: HelmRepository
        name: influxdata
        namespace: infra
  valuesFrom:
    - kind: ConfigMap
      name: influxdb-values
