image:
  repository: influxdb
  tag: 2.7-alpine

persistence:
  enabled: true
  size: 20Gi

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

adminUser:
  organization: "tradingplatform"
  bucket: "market_data"
  user: "admin"
  existingSecret: influxdb-credentials

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
