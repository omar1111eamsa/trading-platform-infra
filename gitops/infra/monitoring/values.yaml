grafana:
  adminPassword: REDACTED-ROTATE-ME
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.example.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.example.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

  persistence:
    enabled: true
    size: 5Gi

  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100

prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 5Gi

# Disk-usage alerts — the cluster has gone down 3x from the root filesystem
# filling up (RabbitMQ mnesia bloat, ClickHouse orphaned store dirs). These
# fire BEFORE DiskPressure eviction (~85-90% used) so there is time to act.
additionalPrometheusRulesMap:
  disk-usage-alerts:
    groups:
      - name: node-disk
        rules:
          - alert: NodeDiskFillingUp70
            expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 70
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Root disk over 70% on {{ $labels.instance }}"
              description: "Root filesystem is {{ printf \"%.1f\" $value }}% full. Investigate before it hits DiskPressure (~85%). Common cause: ClickHouse orphaned store dirs or RabbitMQ mnesia."
          - alert: NodeDiskFillingUp85
            expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 85
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Root disk CRITICAL (>85%) on {{ $labels.instance }}"
              description: "Root filesystem is {{ printf \"%.1f\" $value }}% full. DiskPressure eviction is imminent — free space NOW (ClickHouse store GC, RabbitMQ mnesia, journal vacuum)."
