apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: rabbitmq
  namespace: infra
spec:
  interval: 1h
  chart:
    spec:
      chart: rabbitmq
      version: "12.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: infra
  valuesFrom:
    - kind: ConfigMap
      name: rabbitmq-values
