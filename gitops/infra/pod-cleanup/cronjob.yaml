apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-cleanup
  namespace: infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-cleanup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-cleanup
subjects:
  - kind: ServiceAccount
    name: pod-cleanup
    namespace: infra
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-cleanup
  namespace: infra
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pod-cleanup
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: cleanup
              image: bitnami/kubectl:1.29
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  echo "=== Pod cleanup $(date) ==="
                  FAILED=$(kubectl get pods -A --field-selector=status.phase=Failed --no-headers 2>/dev/null | wc -l)
                  SUCCEEDED=$(kubectl get pods -A --field-selector=status.phase=Succeeded --no-headers 2>/dev/null | wc -l)
                  echo "Found $FAILED failed, $SUCCEEDED succeeded pods"
                  kubectl delete pods -A --field-selector=status.phase=Failed 2>/dev/null && echo "Deleted failed pods" || true
                  kubectl delete pods -A --field-selector=status.phase=Succeeded 2>/dev/null && echo "Deleted succeeded pods" || true
                  echo "Done"
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "10m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
