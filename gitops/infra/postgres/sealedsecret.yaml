apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-credentials
  namespace: infra
spec:
  encryptedData:
    username: <sealed>
    password: <sealed>
  template:
    metadata:
      name: postgres-credentials
      namespace: infra
