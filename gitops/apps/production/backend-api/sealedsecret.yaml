# To generate this file:
# 1. Create a plain secret file (never commit this):
#
#   kubectl create secret generic backend-api-secrets \
#     --namespace production \
#     --from-literal=PORT=8081 \
#     --from-literal=POSTGRES_DSN=postgres://app:password@postgres.infra:5432/terminal_backend?sslmode=disable \
#     --from-literal=JWT_SECRET=your_jwt_secret \
#     --from-literal=JWT_EXPIRES_IN_MINUTES=0 \
#     --from-literal=ADMIN_USERNAME=admin \
#     --from-literal=ADMIN_EMAIL=admin@example.com \
#     --from-literal=ADMIN_PASSWORD=your_admin_password \
#     --from-literal=RABBITMQ_URL=amqp://app:password@rabbitmq.infra:5672/ \
#     --from-literal=CLICKHOUSE_DSN=clickhouse://default:password@clickhouse.infra:9000/app \
#     --dry-run=client -o yaml | \
#   kubeseal --format yaml > apps/production/backend-api/sealedsecret.yaml
#
# 2. Commit sealedsecret.yaml — it is safe to store in git
# 3. Never commit the plain secret file

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backend-api-secrets
  namespace: production
spec:
  encryptedData:
    PORT: <sealed>
    POSTGRES_DSN: <sealed>
    JWT_SECRET: <sealed>
    JWT_EXPIRES_IN_MINUTES: <sealed>
    ADMIN_USERNAME: <sealed>
    ADMIN_EMAIL: <sealed>
    ADMIN_PASSWORD: <sealed>
    RABBITMQ_URL: <sealed>
    CLICKHOUSE_DSN: <sealed>
  template:
    metadata:
      name: backend-api-secrets
      namespace: production
