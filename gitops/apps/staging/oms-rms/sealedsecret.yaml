# kubectl create secret generic oms-rms-secrets \
#   --namespace staging \
#   --from-literal=RABBITMQ_URL=amqp://app:password@rabbitmq.infra:5672/ \
#   --from-literal=BACKEND_API_URL=http://backend-api.staging:8081 \
#   --from-literal=ADMIN_USERNAME=admin \
#   --from-literal=ADMIN_PASSWORD=your_admin_password \
#   --from-literal=ACCOUNT_INFO_EMPTY_DEBOUNCE_MS=250 \
#   --dry-run=client -o yaml | \
# kubeseal --format yaml > apps/staging/oms-rms/sealedsecret.yaml

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: oms-rms-secrets
  namespace: staging
spec:
  encryptedData:
    RABBITMQ_URL: <sealed>
    BACKEND_API_URL: <sealed>
    ADMIN_USERNAME: <sealed>
    ADMIN_PASSWORD: <sealed>
    ACCOUNT_INFO_EMPTY_DEBOUNCE_MS: <sealed>
  template:
    metadata:
      name: oms-rms-secrets
      namespace: staging
