apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-bridge
  namespace: staging
  labels:
    app: market-data-bridge
    env: staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: market-data-bridge
  template:
    metadata:
      labels:
        app: market-data-bridge
        env: staging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: market-data-bridge
          image: ghcr.io/trading-platform/market-data-bridge:906a22be49f563605a4b32e5778b48f6b1e6e22d
          imagePullPolicy: Always
          ports:
            - containerPort: 5558
              hostPort: 5558
          envFrom:
            - secretRef:
                name: backend-api-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      imagePullSecrets:
        - name: ghcr-credentials
