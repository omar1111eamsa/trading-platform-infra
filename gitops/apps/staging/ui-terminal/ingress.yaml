apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui-terminal
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging-terminal.example.com
      secretName: staging-terminal-tls
  rules:
    - host: staging-terminal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui-terminal
                port:
                  number: 3000
