# kubectl create secret generic ui-terminal-secrets \
#   --namespace staging \
#   --from-literal=NEXT_PUBLIC_API_URL=https://staging-api.example.com \
#   --from-literal=NEXT_PUBLIC_WS_URL=wss://staging-api.example.com/ws \
#   --from-literal=NEXT_PUBLIC_MARKET_WS_URL=wss://staging-api.example.com/ws/market \
#   --dry-run=client -o yaml | \
# kubeseal --format yaml > apps/staging/ui-terminal/sealedsecret.yaml

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ui-terminal-secrets
  namespace: staging
spec:
  encryptedData:
    NEXT_PUBLIC_API_URL: <sealed>
    NEXT_PUBLIC_WS_URL: <sealed>
    NEXT_PUBLIC_MARKET_WS_URL: <sealed>
  template:
    metadata:
      name: ui-terminal-secrets
      namespace: staging
