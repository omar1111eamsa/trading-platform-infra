apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-terminal
  namespace: staging
  labels:
    app: ui-terminal
    env: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-terminal
  template:
    metadata:
      labels:
        app: ui-terminal
        env: staging
    spec:
      containers:
        - name: ui-terminal
          image: ghcr.io/trading-platform/ui-terminal:ca9061b0b775c427182902b9793a0bbeddbcc742
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: ui-terminal-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: ghcr-credentials
