apiVersion: apps/v1
kind: Deployment
metadata:
  name: mt5-bridge
  namespace: staging
  labels:
    app: mt5-bridge
    env: staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mt5-bridge
  template:
    metadata:
      labels:
        app: mt5-bridge
        env: staging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: mt5-bridge
          image: ghcr.io/trading-platform/mt5-bridge:e1d0444054fe6fcfa3bbec2d6f7a058865fcec83
          imagePullPolicy: Always
          ports:
            - containerPort: 5556
              hostPort: 5556
          envFrom:
            - secretRef:
                name: mt5-bridge-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      imagePullSecrets:
        - name: ghcr-credentials
