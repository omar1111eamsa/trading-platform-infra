# kubectl create secret generic mt5-bridge-secrets \
#   --namespace staging \
#   --from-literal=RABBITMQ_URL=amqp://app:password@rabbitmq.infra:5672/ \
#   --from-literal=CLICKHOUSE_DSN=clickhouse://default:password@clickhouse.infra:9000/app \
#   --dry-run=client -o yaml | \
# kubeseal --format yaml > apps/staging/mt5-bridge/sealedsecret.yaml

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mt5-bridge-secrets
  namespace: staging
spec:
  encryptedData:
    RABBITMQ_URL: <sealed>
    CLICKHOUSE_DSN: <sealed>
  template:
    metadata:
      name: mt5-bridge-secrets
      namespace: staging
