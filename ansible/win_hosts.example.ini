# Copy to win_hosts.ini and set ansible_host + credentials (do not commit secrets).
# For AWS Windows: use ansible_host=<eip> and ansible_ssh_private_key_file or ssh-agent.
# For GCP IAP: restore ansible_ssh_executable=gcloud and project/zone args.

[windows]
windows-vm

[windows:vars]
ansible_user=Administrator
ansible_connection=ssh
ansible_shell_type=powershell
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
ansible_become_method=runas
ansible_become_user=Administrator
# ansible_become_password=  # prefer Ansible Vault or --ask-become-pass
