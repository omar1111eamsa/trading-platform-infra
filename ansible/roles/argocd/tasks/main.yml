---
- name: Install ArgoCD via Helm
  shell: |
    helm upgrade --install argocd argo/argo-cd \
      --namespace argocd \
      --create-namespace \
      --set server.ingress.enabled=true \
      --set server.ingress.ingressClassName=nginx \
      --set server.ingress.hostname=argocd.{{ domain }} \
      --set server.ingress.tls=true \
      --set server.ingress.annotations."cert-manager\.io/cluster-issuer"=letsencrypt-prod \
      --set configs.params."server\.insecure"=true \
      --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for ArgoCD to be ready
  shell: |
    k3s kubectl rollout status deployment/argocd-server \
      -n argocd --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Get ArgoCD initial admin password
  shell: |
    k3s kubectl -n argocd get secret argocd-initial-admin-secret \
      -o jsonpath="{.data.password}" | base64 -d
  register: argocd_password
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Print ArgoCD admin password
  debug:
    msg: "ArgoCD admin password: {{ argocd_password.stdout }}"

- name: Apply ArgoCD root app (app of apps)
  shell: k3s kubectl apply -f -
  args:
    stdin: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: root
        namespace: argocd
      spec:
        project: default
        source:
          repoURL: {{ gitops_repo }}
          targetRevision: main
          path: {{ gitops_path }}/argocd
        destination:
          server: https://kubernetes.default.svc
          namespace: argocd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
