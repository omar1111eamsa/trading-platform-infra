- name: Ensure monitoring directory exists
  ansible.builtin.file:
    path: "{{ monitoring_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
  when: monitoring_enabled | bool

- name: Render monitoring compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"
  when: monitoring_enabled | bool

- name: Start monitoring stack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - up
      - -d
      - --remove-orphans
  args:
    chdir: "{{ monitoring_dir }}"
  become_user: "{{ deploy_user }}"
  register: monitoring_compose_up
  changed_when: "'Started' in monitoring_compose_up.stderr or 'Creating' in monitoring_compose_up.stderr or 'Recreated' in monitoring_compose_up.stderr"
  when: monitoring_enabled | bool
