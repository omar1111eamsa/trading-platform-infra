---
# Removes an old runner directory (e.g. frontend-vm) using this play's registration token (same GitHub repo).
- name: Check legacy runner directory
  ansible.builtin.stat:
    path: "{{ github_runner_base_dir }}/{{ legacy_runner_name }}"
  register: legacy_runner_dir

- name: Tear down legacy GitHub Actions runner
  when: legacy_runner_dir.stat.exists
  block:
    - name: Check whether legacy runner was configured
      ansible.builtin.stat:
        path: "{{ github_runner_base_dir }}/{{ legacy_runner_name }}/.runner"
      register: legacy_runner_dot

    - name: Stop legacy runner service
      ansible.builtin.command:
        cmd: ./svc.sh stop
        chdir: "{{ github_runner_base_dir }}/{{ legacy_runner_name }}"
      become: true
      ignore_errors: true

    - name: Unregister legacy runner from GitHub
      ansible.builtin.command:
        argv:
          - "{{ github_runner_base_dir }}/{{ legacy_runner_name }}/config.sh"
          - remove
          - --token
          - "{{ github_runner_registration_token }}"
      args:
        chdir: "{{ github_runner_base_dir }}/{{ legacy_runner_name }}"
      become_user: "{{ deploy_user }}"
      no_log: true
      when:
        - legacy_runner_dot.stat.exists
        - (github_runner_registration_token | default('')) | length > 0
      ignore_errors: true

    - name: Uninstall legacy runner systemd unit
      ansible.builtin.command:
        cmd: ./svc.sh uninstall
        chdir: "{{ github_runner_base_dir }}/{{ legacy_runner_name }}"
      become: true
      ignore_errors: true

    - name: Delete legacy runner directory
      ansible.builtin.file:
        path: "{{ github_runner_base_dir }}/{{ legacy_runner_name }}"
        state: absent
      become: true
