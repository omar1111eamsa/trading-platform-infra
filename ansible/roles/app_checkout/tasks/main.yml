- name: Ensure app root exists
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"

- name: Build authenticated GitHub repo URL
  ansible.builtin.set_fact:
    app_repo: >-
      {{
        (github_pat | length > 0)
        | ternary(
          'https://x-access-token:' ~ github_pat ~ '@github.com/' ~ app_repo_path,
          'git@github.com:' ~ app_repo_path
        )
      }}
  no_log: true

- name: Ensure GitHub SSH host key is known
  ansible.builtin.known_hosts:
    path: "{{ deploy_home }}/.ssh/known_hosts"
    name: github.com
    key: "{{ lookup('pipe', 'ssh-keyscan -t rsa github.com 2>/dev/null') }}"
  become_user: "{{ deploy_user }}"
  when: github_pat | length == 0

- name: Clone application repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch }}"
    accept_hostkey: true
    update: true
    force: true
  become_user: "{{ deploy_user }}"
  no_log: true
