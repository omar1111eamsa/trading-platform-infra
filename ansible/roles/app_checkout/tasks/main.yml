- name: Ensure app root exists
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"

- name: Install repository deploy key when provided
  ansible.builtin.copy:
    dest: "{{ deploy_home }}/.ssh/{{ app_name | lower }}_deploy_key"
    content: "{{ app_repo_key }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  when: app_repo_key | length > 0

- name: Build authenticated GitHub repo URL
  ansible.builtin.set_fact:
    app_repo: >-
      {{
        (github_pat | length > 0)
        | ternary(
          'https://x-access-token:' ~ github_pat ~ '@github.com/' ~ app_repo_path,
          'git@github.com:' ~ app_repo_path
        )
      }}
  no_log: true

- name: Ensure GitHub SSH host key is known
  ansible.builtin.known_hosts:
    path: "{{ deploy_home }}/.ssh/known_hosts"
    name: github.com
    key: "{{ lookup('pipe', 'ssh-keyscan -t rsa github.com 2>/dev/null') }}"
  become_user: "{{ deploy_user }}"

- name: Clone application repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch }}"
    accept_hostkey: true
    key_file: "{{ (app_repo_key | length > 0) | ternary(deploy_home ~ '/.ssh/' ~ (app_name | lower) ~ '_deploy_key', omit) }}"
    update: true
  become_user: "{{ deploy_user }}"
  no_log: true
