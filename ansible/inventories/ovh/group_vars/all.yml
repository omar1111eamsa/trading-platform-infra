# Domain
domain: example.com

# k3s version
k3s_version: "v1.29.3+k3s1"

# Helm version
helm_version: "v3.14.4"

# ArgoCD version
argocd_version: "v2.10.4"

# Namespaces
namespaces:
  - argocd
  - infra
  - staging
  - production
  - monitoring
  - falco

# GitHub org
github_org: "trading-platform"

# GHCR registry
ghcr_registry: "ghcr.io/trading-platform"

# GitOps repo
gitops_repo: "https://github.com/trading-platform/SysteM.git"
gitops_path: "gitops"

# Secret aliases (values come from encrypted secrets.yml)
grafana_admin_password: "{{ vault_grafana_admin_password }}"
argocd_admin_password: "{{ vault_argocd_admin_password }}"
github_token: "{{ vault_github_token }}"
