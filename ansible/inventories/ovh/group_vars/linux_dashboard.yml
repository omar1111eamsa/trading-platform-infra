app_name: terminal-dashboard
app_repo_path: Trading-Terminal2025/terminal-dashboard.git
app_dir: "{{ app_root }}/terminal-dashboard"
app_branch: new-infra
env_template: frontend.env.j2
env_dest: "{{ app_dir }}/.env"

github_runner_enabled: true
github_runner_repo: "Trading-Terminal2025/terminal-dashboard"
github_runner_name: "{{ linux_vm_name }}-dashboard"
github_runner_dir_name: terminal-dashboard
github_runner_labels:
  - "{{ linux_vm_name }}-dashboard"
  - stage-tradingplatform
github_runner_registration_token: "{{ dashboard_github_runner_registration_token | default('') }}"
github_runner_cleanup_legacy: []
