# Terminal / Next.js stack on aws_instance.linux_vm (Terraform var linux_vm_name).
# One organization self-hosted runner (labels include both -ui and -api) serves UI-Terminal-, terminal-dashboard, and Terminal-backend workflows.
# GitHub: Organization → Settings → Actions → Runner groups → allow this runner group on the repos you need.
# Token: POST /orgs/{org}/actions/runners/registration-token (org admin) — store as github_org_runner_registration_token in secrets.
app_name: UI-Terminal
app_repo_path: Trading-Terminal2025/UI-Terminal-.git
app_dir: "{{ app_root }}/UI-Terminal-"
app_branch: test-ci
env_template: ui_terminal.env.j2
env_dest: "{{ app_dir }}/.env"
github_runner_enabled: true
github_runner_organization: Trading-Terminal2025
github_runner_name: "{{ linux_vm_name }}-org"
github_runner_labels:
  - "{{ linux_vm_name }}-ui"
  - "{{ linux_vm_name }}-api"
  - stage-tradingplatform
github_runner_registration_token: "{{ github_org_runner_registration_token | default('') }}"
# One-time: remove per-repo runner dirs after switching to org runner; clear after a successful run.
github_runner_cleanup_legacy:
  - "{{ linux_vm_name }}-ui"
  - "{{ linux_vm_name }}-api"
