# terminal-dashboard only: third repo-scoped runner on the same Linux VM (same labels as UI-Terminal workflows).
# Token from terminal-dashboard → Settings → Actions → Runners → New self-hosted runner.
# Workflows: runs-on: [ self-hosted, "{{ linux_vm_name }}-ui" ]
github_runner_enabled: true
github_runner_repo: "Trading-Terminal2025/terminal-dashboard"
github_runner_name: "{{ linux_vm_name }}-dashboard"
github_runner_labels:
  - "{{ linux_vm_name }}-ui"
  - stage-tradingplatform
github_runner_registration_token: "{{ terminal_dashboard_github_runner_registration_token | default('') }}"
github_runner_cleanup_legacy: []
