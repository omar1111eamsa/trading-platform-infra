# Backend API + nginx on aws_instance.linux_vm (Terraform var linux_vm_name).
# GitHub Actions: runs-on: [ self-hosted, "{{ linux_vm_name }}-api" ]
# Self-hosted runner is registered once on the linux_ui play (organization runner with both labels).
app_name: Terminal-backend
app_repo_path: Trading-Terminal2025/Terminal-backend.git
app_dir: "{{ app_root }}/Terminal-backend"
app_branch: test-ci
env_template: backend.env.j2
env_dest: "{{ app_dir }}/.env"
github_runner_enabled: false
