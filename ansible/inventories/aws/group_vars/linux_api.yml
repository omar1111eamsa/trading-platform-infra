app_name: stable-backend-
app_repo_path: Trading-Terminal2025/stable-backend-.git
app_dir: "{{ app_root }}/stable-backend-"
app_branch: test-ci
env_template: backend.env.j2
env_dest: "{{ app_dir }}/.env"

github_runner_enabled: true
github_runner_repo: "Trading-Terminal2025/stable-backend-"
github_runner_name: "{{ linux_vm_name }}-api"
github_runner_dir_name: backend
github_runner_labels:
  - "{{ linux_vm_name }}-api"
  - stage-tradingplatform
github_runner_registration_token: "{{ backend_github_runner_registration_token | default('') }}"
github_runner_cleanup_legacy: []
