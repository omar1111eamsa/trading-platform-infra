- name: Prepare backend VM
  hosts: backend
  become: true
  pre_tasks:
    - name: Load preferred secret file when present
      ansible.builtin.include_vars:
        file: "{{ lookup('first_found', secret_file_candidates, errors='ignore') }}"
      vars:
        secret_file_candidates:
          files:
            - "secrets.vault.yml"
            - "secrets.local.yml"
          paths:
            - "{{ playbook_dir }}/../inventories/test/group_vars"
      when: lookup('first_found', secret_file_candidates, errors='ignore') | length > 0
  roles:
    - common
    - docker
    - deploy_user
    - ssh_hardening
    - app_checkout
    - app_env
    - github_runner
