- name: Prepare backend VM
  hosts: backend
  become: true
  pre_tasks:
    - name: Load vault secrets when present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventories/test/group_vars/secrets.vault.yml"
      when: lookup('ansible.builtin.file', playbook_dir ~ '/../inventories/test/group_vars/secrets.vault.yml', errors='ignore') != ''

    - name: Load local secrets overrides when present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventories/test/group_vars/secrets.local.yml"
      when: lookup('ansible.builtin.file', playbook_dir ~ '/../inventories/test/group_vars/secrets.local.yml', errors='ignore') != ''
  roles:
    - common
    - docker
    - deploy_user
    - ssh_hardening
    - app_checkout
    - app_env
    - github_runner
