- name: Linux VM — API stack
  hosts: linux_api
  become: true
  pre_tasks:
    - name: Load vault secrets when present
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/secrets.vault.yml"
      when: lookup('ansible.builtin.file', inventory_dir ~ '/group_vars/secrets.vault.yml', errors='ignore') != ''
      ignore_errors: true

    - name: Load local secrets overrides when present
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/secrets.local.yml"
      when: lookup('ansible.builtin.file', inventory_dir ~ '/group_vars/secrets.local.yml', errors='ignore') != ''
  roles:
    - common
    - docker
    - admin_user
    - deploy_user
    - ssh_hardening
    - nginx_edge
    - system_deploy
